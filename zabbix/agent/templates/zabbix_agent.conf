PidFile=/var/run/zabbix/zabbix_agent2.pid
LogFile=/var/log/zabbix/zabbix_agent2.log
LogFileSize=0
Server={{ ( [ "127.0.0.1", zabbix_server_addr, zabbix_proxy_addr ] + zabbix_proxy_addrs|default([])) | unique | join(", ") }}
ListenPort={{ zabbix_agent_port }}
#ServerActive={{ zabbix_server_addr }}
Hostname={{ inventory_hostname }}
Include=/etc/zabbix/zabbix_agent2.d/*.conf

{% if zabbix_agent_psk is defined %}
TLSConnect=psk
TLSAccept=psk
TLSPSKFile=/etc/zabbix/zabbix_agent2.psk
TLSPSKIdentity={{ inventory_hostname }}
{% endif %}

ControlSocket=/tmp/agent.sock

DenyKey=system.run[*]
