

defaults {
	user_friendly_names yes
	find_multipaths yes
	skip_kpartx yes
}

devices {
{% for mp_device in multipath_devices %}
	device {
{{ mp_device.conf }}
	}
{% endfor %}
}

blacklist {
{% for multipath_blacklist in multipath_blacklists | default([]) %}
	devnode "{{ multipath_blacklist }}"
{% endfor %}
	devnode "^(ram|zram|raw|loop|fd|md|dm-|sr|scd|st|dcssblk)[0-9]"
	devnode "^(td|hd|vd)[a-z]"
	devnode "^cciss!c[0-9]d[0-9]*"
	devnode "^drbd[0-9]*"
}

multipaths {
{% for mp in multipath %}
{% if 'description' in mp and mp.description|length > 0 %}
	# {{ mp.description }}
{% endif %}
	multipath {
		wwid {{ mp.wwid }}
		alias {{ mp.name }}
	}
{% endfor %}
}
