---
- name: validate admin password
  tags: wazuh-users
  ansible.builtin.assert:
    that:
      - not (wazuh_admin_password is match(".*;.*"))
      - not (wazuh_admin_password is match(".*&.*"))
    fail_msg: "wazuh_admin_password must not contain chars from [;&]"

- name: create log analytics creds file
  tags: wazuh-users
  ansible.builtin.copy:
    content: |
      application_id  = {{ wazuh_log_analytics.application_id }}
      application_key = {{ wazuh_log_analytics.application_key }}
    dest: /var/tmp/wazuh_log_analytics_credentials
    user: 0
    # XXX: wazuh group inside the container, since we're mounting the file r/o
    # we cannot change the permission inside the container
    group: 999
  notify: restart entire wazuh
  when: 'wazuh_log_analytics is defined'

- name: rm log analytics creds file if disabled
  tags: wazuh-users
  ansible.builtin.file:
    path: /var/tmp/wazuh_log_analytics_credentials
    state: absent
  notify: restart entire wazuh
  when: 'wazuh_log_analytics is not defined'

- name: generate docker-compose override
  tags: wazuh-users
  template:
    src: docker-compose.override.yml
    dest: /opt/wazuh-docker/single-node/docker-compose.override.yml
  notify: restart entire wazuh

- name: generate internal_users.yml
  tags: wazuh-users
  template:
    src: internal_users.yml
    dest: /opt/wazuh-docker/single-node/config/wazuh_indexer/internal_users.yml
  notify: reconfigure wazuh users

- name: generate dashboard.yml
  template:
    src: dashboard.yml
    dest: /opt/wazuh-docker/single-node/config/wazuh_dashboard/wazuh.yml
  notify: restart wazuh dashboard
