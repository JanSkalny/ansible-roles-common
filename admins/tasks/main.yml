---

- name: install dependencies (sudo)
  package:
    name: sudo
    state: present

- name: add sudo group
  group:
    name: sudo
    state: present

- name: create sudoers.d
  file:
    path: /etc/sudoers.d
    state: directory
    mode: 0750
    owner: root

- name: passwordless sudoers
  copy:
    src: sudoers
    dest: /etc/sudoers.d/system
    owner: root
    group: root
    mode: 0440

- name: create user
  user:
    name: "{{ item.key }}"
    shell: "{{ item.value.shell | default(default_user_shell) }}"
    password: "{{ item.value.password | default('*') }}"
    state: present
    groups: "{{ item.value.groups | default(default_user_groups) }}"
    createhome: true
  loop: "{{ users | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: add authorized_keys
  authorized_key:
    user: "{{ item.key }}"
    state: present
    exclusive: true
    key: "{{ lookup('file', root_dir ~ '/files/ssh-keys/' ~ (item.value.authorized_keys | default(item.key))) }}"
    path: "/home/{{ item.key }}/.ssh/authorized_keys"
  loop: "{{ users | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: fancy .profile
  template:
    src: dotprofile
    dest: "{{ '~' + item | expanduser }}/.profile"
    owner: "{{ item }}"
    group: "{{ item }}"
    mode: 0640
  loop: "{{ users.keys() | list }}"
  tags: configure

- name: setup initram SSH
  include_tasks: initram_ssh.yml
  when: initram_ssh_enable | bool

- name: remove invalid users
  user:
    name: "{{ item }}"
    state: absent
  loop: "{{ remove_users | difference(users.keys() | list) }}"
