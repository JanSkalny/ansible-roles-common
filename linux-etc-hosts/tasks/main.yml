- name: disable cloud for /etc/hosts
  copy:
    src: 99_disable_hosts.cfg
    dest: /etc/cloud/cloud.cfg.d/
    owner: root
  tags: configure

- name: generate /etc/hosts
  template:
    src: hosts
    dest: /etc/hosts
  tags: configure

- name: set hostname from ansible
  hostname:
    name: "{{ inventory_hostname }}"
