- name: install apt-cacher-ng
  package: 
    name: apt-cacher-ng
    state: present
  tags: install
  notify: restart apt-cacher-ng

- name: configure apt-cacher
  template: 
    src: "{{ item }}"
    dest: "/etc/apt-cacher-ng/{{ item }}"
  tags: configure
  notify: restart apt-cacher-ng
  with_items:
    - "proxy.conf"
    - "passthrough.conf"

- name: make sure service is enabled
  service: 
    name: apt-cacher-ng
    enabled: yes
  tags: configure


