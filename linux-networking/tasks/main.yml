- name: generate /etc/hosts and set hostname
  import_role:
    name: common/linux-etc-hosts
  tags: configure

- name: generate /etc/mactab
  template:
    src: mactab
    dest: /etc/mactab
  when: networking is defined
  tags: configure

- name: disable systemd services
  systemd:
    name: "{{ item }}"
    state: stopped
    enabled: no
    masked: yes
  with_items:
    - systemd-resolved

- name: remove resolvconf
  package:
    name: resolvconf
    state: absent
  tags: install

- name: generate resolv.conf
  template:
    src: resolv.conf
    dest: /etc/resolv.conf
  tags: configure

- name: ifupdown configuration
  include_tasks: ifupdown.yml
  when: linux_networking_method == "ifupdown" and networking is defined
  tags:
  - configure
  - install

- name: netplan configuration
  include_tasks: netplan.yml
  when: linux_networking_method == "netplan" and networking is defined
  tags:
  - configure
  - install

# flush handlers to network changes
- meta: flush_handlers
